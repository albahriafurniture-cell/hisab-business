name: Smoke Test Hisab Business (build + emulator boot)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-test.yml'
      - 'lib/**'
      - 'android/app/**'
      - 'pubspec.yaml'

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'

      - name: Write android/local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HISAB_BUSINESS_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/hisab-business-release.keystore

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install APK, launch app, capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk || true
            adb shell am start -W -n com.hisab.business/.MainActivity || true
            sleep 15
            adb shell pidof com.hisab.business > pid.txt || echo "NOT_RUNNING" > pid.txt
            adb exec-out screencap -p > screenshot.png || true
            adb logcat -d > logcat.txt || true
            adb logcat -b crash -d > crash.txt || true

      - name: Upload APK + boot-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisab-business-boot-test
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            screenshot.png
            logcat.txt
            crash.txt
            pid.txt
          if-no-files-found: warn
